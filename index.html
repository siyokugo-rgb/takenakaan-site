<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>竹中庵 / Takenakaan</title>
  <meta name="description" content="竹中庵（たけなかあん / Takenakaan）は、個人によるソフトウェア・アプリケーション開発の名称です。">
  <style>
    :root {
      --bg: #f6f1e8;
      --ink: #2b2a26;
      --muted: #5c584f;
      --line: #d7cfc2;
      --accent: #3f5a45;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Hiragino Mincho ProN", "Yu Mincho", "YuMincho", serif;
      color: var(--ink);
      background: var(--bg);
      display: flex;
      flex-direction: column;
    }

    header, main, footer {
      width: min(720px, calc(100% - 2.5rem));
      margin: 0 auto;
    }

    header {
      padding: 4.5rem 0 2rem;
      text-align: center;
      border-bottom: 1px solid var(--line);
    }

    h1 {
      font-weight: 500;
      font-size: clamp(2.2rem, 6vw, 3.2rem);
      letter-spacing: 0.22em;
      margin: 0 0 0.85rem 0.22em;
    }

    .english {
      margin: 0 0 1rem;
      font-family: "Palatino Linotype", Palatino, "Times New Roman", serif;
      letter-spacing: 0.18em;
      color: var(--muted);
    }

    .reading {
      margin: 0;
      font-size: 0.95rem;
      letter-spacing: 0.28em;
      color: var(--accent);
    }

    main {
      flex: 1;
      padding: 2.75rem 0 3.5rem;
      line-height: 1.9;
    }

    p { margin: 0 0 1.25rem; }

    a { color: var(--accent); }

    footer {
      padding: 1.25rem 0 2.5rem;
      border-top: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      font-size: 0.88rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <header>
    <h1>竹中庵</h1>
    <p class="english">Takenakaan</p>
    <p class="reading">たけなかあん</p>
  </header>
  <main>
    <p>「竹中庵 / Takenakaan」（読み: たけなかあん）は、個人によるソフトウェア・アプリケーション開発の名称です。</p>
    <p>現時点では法人ではなく、会社または法人として運営しているものではありません。</p>
  </main>
  <footer>
    <span>竹中庵 / Takenakaan</span>
    <a href="./privacy/">プライバシーポリシー</a>
  </footer>
</body>
</html>
